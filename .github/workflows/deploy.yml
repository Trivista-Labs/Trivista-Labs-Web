# Check, build and deploy the website to GitHub Pages on every push to main.
name: Deploy website to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

# Only the deploy job gets write access to Pages. The build job, which installs and
# runs third-party packages, can only read the repository.
permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Unit tests
        run: npm test

      - name: Install the browser for end-to-end tests
        run: npx playwright install --with-deps chromium

      # test:e2e builds the site first, so this step also produces dist/.
      - name: Build, then run end-to-end and accessibility tests
        run: npm run test:e2e

      - name: Copy CNAME to dist
        run: cp ../CNAME ./dist/CNAME

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./frontend/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
