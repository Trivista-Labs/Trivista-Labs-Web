# Checks every pull request and every push to a branch other than main.
# The deploy workflow repeats the type check, unit tests and browser tests
# before publishing main.
name: CI

on:
  pull_request:
  push:
    branches-ignore: ["main"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Contact API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci
      - run: npm test
      - name: Check production dependencies for known vulnerabilities
        run: npm audit --omit=dev --audit-level=high

  frontend:
    name: Website
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - name: Type check
        run: npm run check
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Build the draft preview, which renders the case-study pages
        run: npx astro build --outDir dist-preview
        env:
          PUBLIC_SHOW_DRAFTS: "true"
      - name: Lint
        run: npm run lint
      - name: Install the browser for end-to-end tests
        run: npx playwright install --with-deps chromium
      - name: End-to-end and accessibility tests
        run: npm run test:e2e

      - name: Upload the test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7
